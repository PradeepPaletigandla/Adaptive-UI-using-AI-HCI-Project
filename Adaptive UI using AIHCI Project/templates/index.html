<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Employee Training Recommendation System</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.2);
        }

        h1 {
            color: #0066cc;
        }

        input[type=text] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px 15px;
            background-color: #0066cc;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #004999;
        }

    </style>

</head>

<body>

<div class="container">

<h1>AI Employee Training Recommendation System</h1>

<form action="/recommend" method="POST">

<label for="skill">Enter Skill:</label>

<input
    type="text"
    id="skill"
    name="skill"
    placeholder="Workday Compensation"
    required>

<button type="submit">
Get Recommendations
</button>

</form>

{% if recommendations %}

<h2>Recommendations</h2>

<ul>

{% for item in recommendations %}
<li>{{ item }}</li>
{% endfor %}

</ul>

{% endif %}

</div>

</body>
</html>
